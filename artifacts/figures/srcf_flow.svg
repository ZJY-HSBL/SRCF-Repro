<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
<title id="title">SR-CF algorithm workflow</title>
<desc id="desc">User demographic information, seed ratings, and historical ratings each yield a similarity. Their weighted sum ranks neighbors, then predicts ratings and produces top-N recommendations.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#14213d}.node{fill:#f1f6fc;stroke:#7d9dbc;stroke-width:1.8}.mid{fill:#deedff;stroke:#5079a5;stroke-width:2}.arrow{fill:none;stroke:#446a91;stroke-width:2.5;marker-end:url(#a)}.heading{font-size:16px;font-weight:bold}.small{font-size:13px}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#446a91"/></marker></defs>
<rect x="15" y="18" rx="12" width="242" height="65" class="node"/><text x="136" y="44" text-anchor="middle" class="heading">Demographics · D</text><text x="136" y="66" text-anchor="middle" class="small">age / gender / occupation</text>
<rect x="15" y="117" rx="12" width="242" height="65" class="node"/><text x="136" y="143" text-anchor="middle" class="heading">Seed ratings · S</text><text x="136" y="165" text-anchor="middle" class="small">co-rated selected items</text>
<rect x="15" y="216" rx="12" width="242" height="65" class="node"/><text x="136" y="242" text-anchor="middle" class="heading">Rating history · R</text><text x="136" y="264" text-anchor="middle" class="small">co-rated interactions</text>
<path class="arrow" d="M257 50 L322 50 L322 135 L385 135"/><path class="arrow" d="M257 149 H385"/><path class="arrow" d="M257 249 L322 249 L322 164 L385 164"/>
<rect x="388" y="105" rx="12" width="242" height="85" class="mid"/><text x="509" y="136" text-anchor="middle" class="heading">Fused similarity</text><text x="509" y="164" text-anchor="middle" class="small">0.2 D + 0.3 S + 0.5 R</text>
<path class="arrow" d="M630 147 H690"/>
<rect x="692" y="107" rx="12" width="145" height="80" class="node"/><text x="764" y="138" text-anchor="middle" class="heading">Top-k neighbors</text><text x="764" y="162" text-anchor="middle" class="small">rank similarities</text>
<path class="arrow" d="M837 147 H860"/>
<rect x="864" y="107" rx="12" width="120" height="80" class="node"/><text x="924" y="137" text-anchor="middle" class="heading">Predict rating</text><text x="924" y="160" text-anchor="middle" class="small">Top-N output</text>
<text x="500" y="278" text-anchor="middle" class="small">Adapted from the thesis, chapter 4, Fig. 4.2 · Reconstructed research flow</text>
</svg>
